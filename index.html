<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Turbo Lanes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0f1115; color: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #wrap { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; }
  canvas { display: block; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: rgba(10,12,16,.78); border-radius: 10px; padding: 24px; gap: 14px; }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 42px; letter-spacing: 2px; color: #ffd23f; text-shadow: 0 3px 0 #b5531b; }
  #overlay p { font-size: 16px; line-height: 1.5; color: #d8dce4; max-width: 300px; }
  #overlay .big { font-size: 26px; color: #fff; font-weight: 700; }
  #overlay button { font-size: 20px; font-weight: 700; padding: 14px 40px; border: 0; border-radius: 40px; background: #ff4d4d; color: #fff; cursor: pointer; box-shadow: 0 5px 0 #a82424; }
  #overlay button:active { transform: translateY(3px); box-shadow: 0 2px 0 #a82424; }
  .keys { font-size: 13px; color: #9aa3b2; }
  #muteBtn { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 40px; height: 36px; border: 0; border-radius: 10px; background: rgba(0,0,0,.45); font-size: 18px; cursor: pointer; z-index: 5; }
  #touch { position: absolute; left: 0; right: 0; bottom: 14px; display: none; justify-content: space-between; padding: 0 14px; pointer-events: none; }
  #touch .grp { display: flex; gap: 12px; }
  #touch button { pointer-events: auto; width: 68px; height: 68px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); background: rgba(255,255,255,.15); color: #fff; font-size: 24px; font-weight: 700; }
  #touch button.small { font-size: 13px; }
  #touch button.on { background: rgba(255,255,255,.4); }
  @media (pointer: coarse) { #touch { display: flex; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>
    <button id="muteBtn" title="Sound on or off (M)"></button>

    <div id="overlay">
      <h1>TURBO LANES</h1>
      <p id="msg">Dodge the traffic, grab the coins and see how far you can go.</p>
      <button id="startBtn">START</button>
      <p class="keys">Arrow keys or A / D to steer<br>Up or W to boost, Down or S to brake<br>P to pause, M to turn sound on or off</p>
    </div>

    <div id="touch">
      <div class="grp">
        <button id="tLeft">&#9664;</button>
        <button id="tRight">&#9654;</button>
      </div>
      <div class="grp">
        <button id="tBrake" class="small">BRAKE</button>
        <button id="tBoost" class="small">BOOST</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const W = 400, H = 700;
  cv.width = W; cv.height = H;

  function fit() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.98;
    cv.style.width = (W * s) + 'px';
    cv.style.height = (H * s) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();

  const ROAD_L = 50, ROAD_R = 350, LANES = 3, LANE_W = (ROAD_R - ROAD_L) / LANES;
  const CAR_COLORS = ['#3fa7ff', '#7ed957', '#ffb03f', '#c77dff', '#ffffff', '#ff7aa8', '#2ec4b6'];

  const overlay = document.getElementById('overlay');
  const msg = document.getElementById('msg');
  const startBtn = document.getElementById('startBtn');

  let best = 0;
  try { best = parseInt(localStorage.getItem('turboLanesBest') || '0', 10) || 0; } catch (e) {}

  const keys = { left: false, right: false, boost: false, brake: false };
  let state = 'menu';
  let player, enemies, coins, particles, speed, distance, bonus, elapsed, spawnT, coinT, roadOff, crashT, last, milestone;

  // ---------- Sound (all generated in code, no audio files needed) ----------
  let audio = null, master = null, musicGain = null, engineGain = null, engOsc1 = null, engOsc2 = null, muted = false;
  let musicStep = 0, nextNote = 0;
  try { muted = localStorage.getItem('turboLanesMuted') === '1'; } catch (e) {}

  function initAudio() {
    if (audio) { if (audio.state === 'suspended') audio.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      audio = new AC();
      master = audio.createGain();
      master.gain.value = muted ? 0 : 0.5;
      master.connect(audio.destination);
      musicGain = audio.createGain();
      musicGain.gain.value = 0.12;
      musicGain.connect(master);

      // engine: two slightly detuned oscillators through a low pass filter
      engineGain = audio.createGain();
      engineGain.gain.value = 0;
      const f = audio.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 600;
      engOsc1 = audio.createOscillator(); engOsc1.type = 'sawtooth'; engOsc1.frequency.value = 60;
      engOsc2 = audio.createOscillator(); engOsc2.type = 'square'; engOsc2.frequency.value = 61.5;
      engOsc1.connect(f); engOsc2.connect(f); f.connect(engineGain); engineGain.connect(master);
      engOsc1.start(); engOsc2.start();
    } catch (e) { audio = null; }
  }

  function tone(freq, dur, type, vol, slideTo, delay, dest) {
    if (!audio || muted) return;
    const t0 = audio.currentTime + Math.max(0, delay || 0);
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(vol || 0.3, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(dest || master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }

  function noise(dur, vol, filterType, freq, freqTo) {
    if (!audio || muted) return;
    const len = Math.floor(audio.sampleRate * dur);
    const buf = audio.createBuffer(1, len, audio.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = audio.createBufferSource(), g = audio.createGain(), f = audio.createBiquadFilter();
    const now = audio.currentTime;
    src.buffer = buf;
    f.type = filterType || 'lowpass';
    f.frequency.setValueAtTime(freq || 1200, now);
    if (freqTo) f.frequency.exponentialRampToValueAtTime(freqTo, now + dur);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
  }

  const sfx = {
    coin: () => { tone(1047, 0.07, 'square', 0.14); tone(1568, 0.18, 'square', 0.14, null, 0.06); },
    boost: () => noise(0.5, 0.25, 'bandpass', 400, 3000),
    brake: () => noise(0.35, 0.18, 'bandpass', 2500, 1800),
    crash: () => { noise(0.7, 0.5, 'lowpass', 2000, 200); tone(120, 0.5, 'sawtooth', 0.35, 40); },
    milestone: () => [784, 988, 1175].forEach((f, i) => tone(f, 0.12, 'triangle', 0.25, null, i * 0.07)),
    over: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.3, 'triangle', 0.3, null, 0.4 + i * 0.25)),
    best: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i === 5 ? 0.5 : 0.14, 'square', 0.16, null, 0.4 + i * 0.13))
  };

  function updateEngine() {
    if (!audio || !engineGain) return;
    const now = audio.currentTime;
    const on = state === 'play' && !muted;
    engineGain.gain.setTargetAtTime(on ? 0.09 : 0, now, 0.08);
    const f = 45 + speed * 6;
    engOsc1.frequency.setTargetAtTime(f, now, 0.05);
    engOsc2.frequency.setTargetAtTime(f * 1.02, now, 0.05);
  }

  // a short original driving tune that loops while you race
  const BASSLINE = [45, 45, 57, 45, 43, 43, 55, 43, 41, 41, 53, 41, 43, 43, 55, 47];
  const LEAD =     [69, 0, 72, 0, 74, 0, 72, 69, 67, 0, 69, 0, 71, 0, 74, 0,
                    69, 0, 72, 0, 76, 0, 74, 72, 74, 0, 72, 0, 71, 0, 67, 0];
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);

  function musicTick() {
    if (!audio || muted || state !== 'play') return;
    const len = 60 / 160 / 2;
    if (nextNote < audio.currentTime) nextNote = audio.currentTime + 0.05;
    while (nextNote < audio.currentTime + 0.2) {
      const when = nextNote - audio.currentTime;
      const b = BASSLINE[musicStep % BASSLINE.length];
      tone(midi(b), len * 0.9, 'triangle', 1, null, when, musicGain);
      const l = LEAD[musicStep % LEAD.length];
      if (l) tone(midi(l), len * 1.6, 'square', 0.35, null, when, musicGain);
      nextNote += len;
      musicStep++;
    }
  }
  setInterval(musicTick, 40);

  const muteBtn = document.getElementById('muteBtn');
  function showMute() { muteBtn.textContent = muted ? '\u{1F507}' : '\u{1F50A}'; }
  function toggleMute() {
    muted = !muted;
    initAudio();
    if (master) master.gain.value = muted ? 0 : 0.5;
    try { localStorage.setItem('turboLanesMuted', muted ? '1' : '0'); } catch (e) {}
    showMute();
  }
  showMute();

  function setKey(k, down) {
    if (down && !keys[k] && state === 'play') {
      if (k === 'boost') sfx.boost();
      if (k === 'brake') sfx.brake();
    }
    keys[k] = down;
  }

  function reset() {
    player = { x: W / 2 - 20, y: H - 140, w: 40, h: 72, tilt: 0 };
    enemies = []; coins = []; particles = [];
    speed = 6; distance = 0; bonus = 0; elapsed = 0;
    spawnT = 0.8; coinT = 2; roadOff = 0; crashT = 0; milestone = 0;
  }

  function score() { return Math.floor(distance / 10) + bonus; }

  function laneX(lane, w) { return ROAD_L + lane * LANE_W + (LANE_W - w) / 2; }

  function laneFree(lane, list) {
    return !list.some(o => o.lane === lane && o.y < 160);
  }

  function spawnEnemy() {
    const lane = Math.floor(Math.random() * LANES);
    if (!laneFree(lane, enemies) || !laneFree(lane, coins)) return;
    // never block all lanes at the top at once
    const topLanes = new Set(enemies.filter(e => e.y < 200).map(e => e.lane));
    topLanes.add(lane);
    if (topLanes.size >= LANES) return;
    enemies.push({
      lane, x: laneX(lane, 40), y: -90, w: 40, h: 72,
      v: 2 + Math.random() * 2.5,
      color: CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)]
    });
  }

  function spawnCoin() {
    const lane = Math.floor(Math.random() * LANES);
    if (!laneFree(lane, enemies) || !laneFree(lane, coins)) return;
    coins.push({ lane, x: laneX(lane, 24), y: -30, w: 24, h: 24, spin: 0 });
  }

  function hit(a, b, pad) {
    return a.x + pad < b.x + b.w - pad && a.x + a.w - pad > b.x + pad &&
           a.y + pad < b.y + b.h - pad && a.y + a.h - pad > b.y + pad;
  }

  function boom(x, y) {
    for (let i = 0; i < 40; i++) {
      const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 6;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, c: Math.random() < 0.5 ? '#ffd23f' : '#ff4d4d' });
    }
  }

  function update(dt) {
    const sec = dt / 60;

    if (state === 'play') {
      elapsed += sec;
      const base = Math.min(6 + elapsed * 0.15, 18);
      let target = base;
      if (keys.boost) target = base * 1.4;
      if (keys.brake) target = base * 0.5;
      speed += (target - speed) * 0.05 * dt;

      let dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      player.x += dir * 6 * dt;
      player.tilt += (dir * 0.12 - player.tilt) * 0.2 * dt;
      if (player.x < ROAD_L + 4) player.x = ROAD_L + 4;
      if (player.x + player.w > ROAD_R - 4) player.x = ROAD_R - 4 - player.w;

      distance += speed * dt;
      const m = Math.floor(score() / 500);
      if (m > milestone) { milestone = m; sfx.milestone(); }

      spawnT -= sec;
      if (spawnT <= 0) { spawnEnemy(); spawnT = Math.max(0.4, 1.3 - elapsed * 0.02) * (0.7 + Math.random() * 0.6); }
      coinT -= sec;
      if (coinT <= 0) { spawnCoin(); coinT = 1.5 + Math.random() * 2; }
    }

    if (state === 'play' || state === 'crash') {
      const s = state === 'crash' ? speed * Math.max(0, 1 - crashT * 2) : speed;
      roadOff = (roadOff + s * dt) % 60;

      for (const e of enemies) e.y += (s - e.v) * dt;
      enemies = enemies.filter(e => e.y < H + 100 && e.y > -300);

      for (const c of coins) { c.y += s * dt; c.spin += 0.1 * dt; }
      coins = coins.filter(c => c.y < H + 40);

      if (state === 'play') {
        for (const e of enemies) {
          if (hit(player, e, 5)) {
            state = 'crash'; crashT = 0;
            boom(player.x + player.w / 2, player.y + 10);
            sfx.crash();
            break;
          }
        }
        coins = coins.filter(c => {
          if (hit(player, c, 0)) { bonus += 50; sfx.coin(); return false; }
          return true;
        });
      }
    }

    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.95; p.vy *= 0.95; p.life -= 0.02 * dt; }
    particles = particles.filter(p => p.life > 0);

    if (state === 'crash') {
      crashT += sec;
      if (crashT > 1.1) gameOver();
    }
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawCar(x, y, w, h, color, isPlayer, tilt) {
    ctx.save();
    ctx.translate(x + w / 2, y + h / 2);
    if (tilt) ctx.rotate(tilt);
    if (!isPlayer) ctx.rotate(Math.PI);
    const L = -w / 2, T = -h / 2;

    ctx.fillStyle = 'rgba(0,0,0,.35)';
    rr(L + 3, T + 5, w, h, 9); ctx.fill();

    ctx.fillStyle = '#111';
    ctx.fillRect(L - 4, T + 10, 6, 16); ctx.fillRect(L + w - 2, T + 10, 6, 16);
    ctx.fillRect(L - 4, T + h - 26, 6, 16); ctx.fillRect(L + w - 2, T + h - 26, 6, 16);

    ctx.fillStyle = color;
    rr(L, T, w, h, 9); ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.fillRect(L + w / 2 - 4, T + 2, 8, h - 4);

    ctx.fillStyle = '#1d2a3a';
    rr(L + 5, T + 16, w - 10, 14, 4); ctx.fill();
    rr(L + 6, T + h - 22, w - 12, 10, 3); ctx.fill();

    ctx.fillStyle = '#fff6b0';
    ctx.fillRect(L + 4, T + 1, 8, 4); ctx.fillRect(L + w - 12, T + 1, 8, 4);
    ctx.fillStyle = '#ff3030';
    ctx.fillRect(L + 4, T + h - 4, 8, 3); ctx.fillRect(L + w - 12, T + h - 4, 8, 3);
    ctx.restore();
  }

  function draw() {
    ctx.fillStyle = '#3a8a3a';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#347d34';
    for (let y = -60 + roadOff; y < H; y += 60) {
      ctx.fillRect(0, y, ROAD_L, 30);
      ctx.fillRect(ROAD_R, y, W - ROAD_R, 30);
    }

    ctx.fillStyle = '#2f3236';
    ctx.fillRect(ROAD_L, 0, ROAD_R - ROAD_L, H);

    for (let y = -60 + roadOff; y < H; y += 30) {
      const red = Math.floor((y - roadOff + 60) / 30) % 2 === 0;
      ctx.fillStyle = red ? '#e63946' : '#f1f1f1';
      ctx.fillRect(ROAD_L - 8, y, 8, 30);
      ctx.fillRect(ROAD_R, y, 8, 30);
    }

    ctx.fillStyle = '#e8e8e8';
    for (let i = 1; i < LANES; i++) {
      const x = ROAD_L + i * LANE_W - 3;
      for (let y = -60 + roadOff; y < H; y += 60) ctx.fillRect(x, y, 6, 32);
    }

    for (const c of coins) {
      const cx = c.x + c.w / 2, cy = c.y + c.h / 2;
      const sx = Math.abs(Math.cos(c.spin)) * 12 + 2;
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath(); ctx.ellipse(cx, cy, sx, 12, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#c98a00'; ctx.lineWidth = 2; ctx.stroke();
    }

    for (const e of enemies) drawCar(e.x, e.y, e.w, e.h, e.color, false, 0);

    if (state !== 'crash' || crashT < 0.15) {
      drawCar(player.x, player.y, player.w, player.h, '#ff4d4d', true, player.tilt);
    } else {
      ctx.globalAlpha = Math.max(0, 1 - crashT);
      drawCar(player.x, player.y, player.w, player.h, '#555', true, player.tilt + crashT);
      ctx.globalAlpha = 1;
    }

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
    }
    ctx.globalAlpha = 1;

    if (state !== 'menu') {
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      rr(10, 10, 170, 62, 10); ctx.fill();
      rr(W - 130, 10, 120, 62, 10); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('Score ' + score(), 22, 38);
      ctx.font = '14px system-ui, sans-serif';
      ctx.fillStyle = '#c9ced8';
      ctx.fillText('Best ' + Math.max(best, score()), 22, 60);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px system-ui, sans-serif';
      ctx.fillText(Math.round(speed * 12), W - 22, 38);
      ctx.font = '14px system-ui, sans-serif';
      ctx.fillStyle = '#c9ced8';
      ctx.fillText('km/h', W - 22, 60);
    }

    if (state === 'pause') {
      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 40px system-ui, sans-serif';
      ctx.fillText('PAUSED', W / 2, H / 2);
      ctx.font = '16px system-ui, sans-serif';
      ctx.fillText('Press P or tap to continue', W / 2, H / 2 + 34);
    }
  }

  function loop(t) {
    if (!last) last = t;
    let dt = (t - last) / (1000 / 60);
    last = t;
    if (dt > 3) dt = 3;
    if (state !== 'pause' && state !== 'menu' && state !== 'over') update(dt);
    else if (state === 'over') update(dt);
    updateEngine();
    draw();
    requestAnimationFrame(loop);
  }

  function start() {
    initAudio();
    reset();
    musicStep = 0; nextNote = 0;
    state = 'play';
    overlay.classList.add('hidden');
  }

  function gameOver() {
    state = 'over';
    const s = score();
    let newBest = false;
    if (s > best) {
      best = s; newBest = true;
      try { localStorage.setItem('turboLanesBest', String(best)); } catch (e) {}
    }
    if (newBest) sfx.best(); else sfx.over();
    overlay.querySelector('h1').textContent = 'CRASHED';
    msg.innerHTML = '<span class="big">Score ' + s + '</span><br>' + (newBest ? 'New best score!' : 'Best ' + best);
    startBtn.textContent = 'RACE AGAIN';
    overlay.classList.remove('hidden');
  }

  function togglePause() {
    if (state === 'play') state = 'pause';
    else if (state === 'pause') { state = 'play'; last = 0; }
  }

  startBtn.addEventListener('click', start);

  const map = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right',
                ArrowUp: 'boost', w: 'boost', W: 'boost', ArrowDown: 'brake', s: 'brake', S: 'brake' };
  window.addEventListener('keydown', e => {
    initAudio();
    if (map[e.key]) { setKey(map[e.key], true); e.preventDefault(); }
    if (e.key === 'p' || e.key === 'P') togglePause();
    if (e.key === 'm' || e.key === 'M') toggleMute();
    if ((e.key === 'Enter' || e.key === ' ') && (state === 'menu' || state === 'over')) { start(); e.preventDefault(); }
  });
  window.addEventListener('keyup', e => { if (map[e.key]) keys[map[e.key]] = false; });
  window.addEventListener('blur', () => { if (state === 'play') state = 'pause'; for (const k in keys) keys[k] = false; });

  cv.addEventListener('pointerdown', () => { initAudio(); if (state === 'pause') togglePause(); });
  muteBtn.addEventListener('click', e => { e.stopPropagation(); toggleMute(); });

  function hold(id, key) {
    const b = document.getElementById(id);
    const on = e => { e.preventDefault(); initAudio(); setKey(key, true); b.classList.add('on'); };
    const off = e => { e.preventDefault(); keys[key] = false; b.classList.remove('on'); };
    b.addEventListener('pointerdown', on);
    b.addEventListener('pointerup', off);
    b.addEventListener('pointerleave', off);
    b.addEventListener('pointercancel', off);
  }
  hold('tLeft', 'left'); hold('tRight', 'right'); hold('tBoost', 'boost'); hold('tBrake', 'brake');

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
